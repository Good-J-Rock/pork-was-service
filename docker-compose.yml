version: '3.8'

services:
  # Spring Boot 애플리케이션 서비스
  app:
    build: . # 현재 디렉토리의 Dockerfile을 사용하여 이미지를 빌드
    container_name: handon-bizmsg-app
    depends_on:
      - db # 'db' 서비스가 시작된 후에 실행
    ports:
      - "8080:8080" # 로컬 8080 포트와 컨테이너 8080 포트를 연결
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/mydatabase
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mypassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  # MariaDB 데이터베이스 서비스
  db:
    image: mariadb:10.6 # MariaDB 10.6 버전 이미지 사용
    container_name: my-mariadb
    ports:
      - "3306:3306" # 로컬 3306 포트와 컨테이너 3306 포트를 연결 (DB 툴로 직접 접속 시 유용)
    environment:
      - MARIADB_ROOT_PASSWORD=mypassword
      - MARIADB_DATABASE=mydatabase
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: