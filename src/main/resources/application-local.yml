# ---------------------------------
# MyBatis 설정
# ---------------------------------
mybatis:
  # (필수) Mapper XML 파일의 위치를 지정합니다.
  # src/main/resources/mappers/ 디렉토리 및 그 하위의 모든 .xml 파일을 의미합니다.
  mapper-locations: classpath:mappers/**/*.xml

  # (선택) VO, DTO 등이 있는 모델 클래스의 패키지 경로를 지정합니다.
  # XML에서 resultType="User"처럼 짧은 별칭을 사용할 수 있게 됩니다.
  #    type-aliases-package: com.example.yourproject.model

  # (선택) mybatis-config.xml 파일의 위치를 지정할 수 있습니다.
  # (yml에서 설정하기 어려운 세부 옵션을 설정할 때 사용)
  # config-location: classpath:mybatis-config.xml

  # (권장) MyBatis의 상세 설정을 yml에서 직접 제어
  configuration:
    # DB 컬럼(snake_case)과 Java 필드(camelCase) 간 자동 매핑 활성화
    map-underscore-to-camel-case: true
    # 쿼리 파라미터가 null일 때 JDBC 타입을 명시 (기본: OTHER)
    jdbc-type-for-null: 'NULL'